<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <title>RKD FM | Next-Gen Internet Radio Discovery</title>
    <meta name="description" content="Discover and stream world FM internet stations with RKD FM. Rapidly scan, play, and save your favorite stations with futuristic audio visualizers.">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Icons & HLS Stream Player -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Dynamic Background Lights -->
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="cyber-grid-overlay"></div>
        
        <!-- Top App Header -->
        <header>
            <div class="logo">
                <div class="logo-text-group">
                    <img src="rkd_logo.png" alt="RKD Logo" class="header-logo-img">
                    <div class="logo-text-inner">
                        <span class="logo-title">RKD FM</span>
                        <span class="logo-sub">CYBER RADIO DECK</span>
                    </div>
                </div>
            </div>


            <div class="header-controls">
                <!-- Sleep Timer Button -->
                <div class="sleep-timer-wrapper">
                    <button id="sleep-timer-btn" class="icon-btn theme-btn" title="Sleep Timer">
                        <i data-lucide="clock"></i>
                        <span id="timer-badge" class="timer-badge" style="display: none;">OFF</span>
                    </button>
                    <div id="sleep-timer-menu" class="sleep-timer-menu glass" style="display: none;">
                        <span class="menu-title">Sleep Timer</span>
                        <button data-minutes="0" class="timer-opt active">Off</button>
                        <button data-minutes="15" class="timer-opt">15 Min</button>
                        <button data-minutes="30" class="timer-opt">30 Min</button>
                        <button data-minutes="45" class="timer-opt">45 Min</button>
                        <button data-minutes="60" class="timer-opt">60 Min</button>
                    </div>
                </div>

                <button id="fullscreen-btn" class="icon-btn theme-btn" title="Toggle Fullscreen">
                    <i data-lucide="maximize" id="fullscreen-icon"></i>
                </button>
                
                <button id="theme-toggle" class="icon-btn theme-btn" title="Toggle Light/Dark Theme">
                    <i data-lucide="moon" id="theme-icon"></i>
                </button>
            </div>
        </header>

        <!-- Main Navigation Bar -->
        <nav class="main-tabs glass" id="main-tabs">
            <button class="tab-btn action-btn auto-scan-glow" id="smart-auto-scan-btn">
                <i data-lucide="zap"></i>
                <span>Auto Scan</span>
            </button>
            
            <button class="tab-btn active" data-tab="discovery">
                <i data-lucide="compass"></i>
                <span>Discover</span>
            </button>

            <button class="tab-btn" data-tab="playlist">
                <i data-lucide="list-music"></i>
                <span>Playlist</span>
                <span id="playlist-count-badge" class="pill-count">0</span>
            </button>
            
            <button class="tab-btn action-btn" id="tab-refresh-btn" title="Reload Stations">
                <i data-lucide="refresh-cw"></i>
                <span>Refresh</span>
            </button>
            
            <div class="search-bar main-search-bar">
                <i data-lucide="search" class="search-input-icon"></i>
                <input type="text" id="station-search" placeholder="Search station, genre, city..." autocomplete="off">
                <button id="clear-search-btn" class="icon-btn clear-btn" title="Clear search" style="display:none;">
                    <i data-lucide="x"></i>
                </button>
                <button id="search-btn" class="primary-btn" title="Search Stations">
                    <span>Search</span>
                </button>
            </div>
        </nav>

        <main>
        <div id="discovery-view">
            <!-- Category Selector Bar -->
            <nav class="category-nav glass" id="categories-nav">
                <button id="mode-toggle-btn" class="tab-btn action-btn india-active mode-pill-btn">
                    <span id="mode-toggle-icon" class="flag-icon">🇮🇳</span>
                    <span id="mode-toggle-text">India</span>
                </button>
                
                <div class="cats-wrapper" id="categories-bar">
                    <div class="cat-scroll" id="india-cats">
                        <button class="cat-btn active" data-tag="">ALL</button>
                        <button class="cat-btn" data-tag="bollywood">BOLLYWOOD</button>
                        <button class="cat-btn" data-tag="news">NEWS</button>
                        <button class="cat-btn" data-tag="bhakti">BHAKTI</button>
                        <button class="cat-btn" data-tag="dj remix">DJ - REMIX</button>
                        <button class="cat-btn" data-tag="classic">CLASSIC</button>
                        <button class="cat-btn" data-tag="bangla">BANGLA</button>
                        <button class="cat-btn" data-tag="singer">SINGER</button>
                        <button class="cat-btn" data-tag="gazal">GAZAL</button>
                        <button class="cat-btn" data-tag="music">MUSIC</button>
                        <button class="cat-btn" data-tag="air">AIR</button>
                        <button class="cat-btn" data-tag="bhojpuri">BHOJPURI</button>
                        <button class="cat-btn" data-tag="punjabi">PUNJABI</button>
                        <button class="cat-btn" data-tag="regional">REGIONAL</button>
                    </div>
                    
                    <div class="cat-scroll" id="global-cats" style="display: none;">
                        <button class="cat-btn active" data-tag="">ALL</button>
                        <button class="cat-btn" data-tag="australia news">AUSTRALIA NEWS</button>
                        <button class="cat-btn" data-tag="euro news">EURO NEWS</button>
                        <button class="cat-btn" data-tag="bbc news">BBC NEWS</button>
                        <button class="cat-btn" data-tag="us news">US NEWS</button>
                        <button class="cat-btn" data-tag="world news">WORLD NEWS</button>
                        <button class="cat-btn" data-tag="russian news">RUSSIAN NEWS</button>
                        <button class="cat-btn" data-tag="pop">POP</button>
                        <button class="cat-btn" data-tag="rock">ROCK</button>
                        <button class="cat-btn" data-tag="jazz">JAZZ</button>
                        <button class="cat-btn" data-tag="classical">CLASSICAL</button>
                        <button class="cat-btn" data-tag="hip hop">HIP HOP</button>
                        <button class="cat-btn" data-tag="electronic">ELECTRONIC</button>
                        <button class="cat-btn" data-tag="ambient">AMBIENT</button>
                        <button class="cat-btn" data-tag="dance music">DANCE MUSIC</button>
                        <button class="cat-btn" data-tag="educational">EDUCATIONAL</button>
                        <button class="cat-btn" data-tag="sports">SPORTS</button>
                        <button class="cat-btn" data-tag="talk">TALK</button>
                    </div>
                </div>
            </nav>

            <!-- Main Cyber Deck / Now Playing Deck -->
            <section class="hero-section" id="hero-section">
                <!-- Hero Drag Volume Percentage Orange Circle HUD -->
                <div id="hero-volume-overlay" class="hero-volume-overlay">
                    <div class="volume-circle-hud">
                        <span id="hero-volume-text" class="volume-text-num">30%</span>
                        <span class="volume-hud-label">VOLUME</span>
                    </div>
                </div>

                <div class="now-playing-card glass">
                    <div class="station-visual">
                        <div class="station-audio-aura" id="station-audio-aura"></div>
                        <div class="vinyl-wrapper" id="vinyl-wrapper">
                            <div class="vinyl-groove"></div>
                            <img id="current-station-info-img" src="rkd_logo.png" alt="Station Logo" title="Click to save to playlist" loading="eager" fetchpriority="high">
                            <div class="center-spindle"></div>
                        </div>
                        <button id="add-to-playlist-btn" class="fav-heart-btn" title="Save to Playlist">
                            <i data-lucide="heart" id="fav-heart-icon"></i>
                        </button>
                    </div>
                    
                    <div class="station-details">
                        <div class="lcd-meta-row">
                            <span class="status-badge" id="player-status">Ready</span>
                        </div>
                        
                        <h1 id="current-station-name">Choose a Station</h1>
                        <p id="current-station-meta">Select a station to start broadcasting</p>
                        
                        <div id="queue-text-info">
                            <span class="queue-text-item next-text-item" id="queue-next-item">
                                <span class="queue-label">NEXT:</span>
                                <span class="queue-name" id="queue-next-name">--</span>
                            </span>
                            <span class="queue-text-item prev-text-item" id="queue-prev-item" style="display: none;">
                                <span class="queue-label">PREV:</span>
                                <span class="queue-name" id="queue-prev-name">--</span>
                            </span>
                        </div>
                    </div>
                </div>

                <!-- Equalizer & Master Audio Control Strip -->
                <div class="eq-controls-row">
                    <button id="eq-hd-btn" class="control-btn fx-btn" title="Toggle HD Sound & EQ Enhancement">
                        <span class="fx-led"></span>
                        <span>HD / EQ</span>
                    </button>
                    
                    <button id="dj-boost-btn" class="control-btn fx-btn" title="Toggle DJ Beats & Dynamic Bass Boost">
                        <span class="fx-led"></span>
                        <span>DJ Boost</span>
                    </button>
                    
                    <button id="3d-surround-btn" class="control-btn fx-btn" title="Toggle 3D Surround Spatial Audio">
                        <span class="fx-led"></span>
                        <span>3D Surround</span>
                    </button>
                    
                    <div class="vol-boost-check" title="Toggle Volume Boost">
                        <input type="checkbox" id="vol-boost-check-input">
                        <label for="vol-boost-check-input">Vol Boost</label>
                    </div>
                </div>
            </section>

            <!-- Discovered Stations Grid & Quick Playlist -->
            <section class="content-grid" id="discovery-grid">
                <div class="stations-column">
                    <div class="section-header">
                        <div class="section-title-group">
                            <h2>Discovered Stations</h2>
                            <span id="results-count" class="results-badge">0 stations found</span>
                        </div>
                        
                        <div class="section-tools">
                            <div class="view-mode-toggle desktop-only">
                                <button id="grid-view-btn" class="view-btn active" title="Grid View">
                                    <i data-lucide="grid"></i>
                                </button>
                                <button id="list-view-btn" class="view-btn" title="List View">
                                    <i data-lucide="list"></i>
                                </button>
                            </div>

                            <button class="icon-btn collapse-toggle-btn" onclick="toggleBothSections(this)" title="Toggle View Sections">
                                <i data-lucide="chevron-down"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div id="stations-grid" class="stations-list grid-layout">
                        <!-- Stations will be injected here -->
                    </div>
                    
                    <div class="loader-container" id="main-loader" style="display: none;">
                        <div class="loader-cyber">
                            <div class="spinner"></div>
                            <span>Scanning Frequencies...</span>
                        </div>
                    </div>
                </div>

                <!-- Desktop Sidebar Playlist -->
                <aside class="playlist-column desktop-playlist">
                    <div class="section-header">
                        <h2>Quick Favorites</h2>
                        <span class="playlist-pill-info" id="quick-fav-count">0 items</span>
                    </div>
                    
                    <div id="quick-playlist-list" class="stations-list">
                        <!-- Playlist items will be injected here -->
                    </div>
                </aside>
            </section>
        </div>

        <!-- Full Playlist View -->
        <div id="playlist-view" style="display: none;">
            <section class="content-grid-single">
                <div class="section-header">
                    <h2>Your Saved Stations Playlist</h2>
                </div>
                <div id="full-playlist-list" class="stations-list">
                    <!-- Playlist will be rendered here -->
                </div>
            </section>
        </div>
    </main>

        <!-- Fixed Bottom Floating Deck Controls -->
        <footer class="player-controls glass">
            <div class="main-controls">
                <button id="prev-btn" class="control-btn nav-ctrl-btn" title="Previous Station">
                    <i data-lucide="skip-back"></i>
                </button>
                
                <button id="play-pause-btn" class="control-btn play-btn" title="Play/Pause">
                    <i data-lucide="play" id="play-icon"></i>
                </button>
                
                <button id="next-btn" class="control-btn nav-ctrl-btn" title="Next Station">
                    <i data-lucide="skip-forward"></i>
                </button>
            </div>
        </footer>

        <!-- Toast Notifications Container -->
        <div id="toast-container" class="toast-container"></div>

        <!-- Hidden Audio Element -->
        <audio id="audio-player" autoplay preload="auto" crossorigin="anonymous"></audio>
        <!-- Keep-Alive Audio for Background Playback -->
        <audio id="keep-alive-audio" loop preload="auto" src="data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA"></audio>
    </div>

    <script src="script.js"></script>
    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        // Mouse-following Parallax Glowing Blobs
        document.addEventListener('mousemove', (e) => {
            const x = e.clientX;
            const y = e.clientY;
            
            const blob1 = document.querySelector('.blob-1');
            const blob2 = document.querySelector('.blob-2');
            const blob3 = document.querySelector('.blob-3');
            
            if (blob1 && blob2 && blob3) {
                const moveX1 = (x - window.innerWidth / 2) * 0.04;
                const moveY1 = (y - window.innerHeight / 2) * 0.04;
                blob1.style.transform = `translate(${moveX1}px, ${moveY1}px)`;
                
                const moveX2 = (x - window.innerWidth / 2) * -0.04;
                const moveY2 = (y - window.innerHeight / 2) * -0.04;
                blob2.style.transform = `translate(${moveX2}px, ${moveY2}px)`;

                const moveX3 = (x - window.innerWidth / 2) * 0.02;
                const moveY3 = (y - window.innerHeight / 2) * 0.02;
                blob3.style.transform = `translate(${moveX3}px, ${moveY3}px)`;
            }
        });
    </script>
</body>
</html>
